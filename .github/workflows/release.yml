# Builds Otaria for macOS (one universal app: Apple Silicon + Intel), Windows and Linux, and attaches the installers
# to a draft release in the public repo Rhaima96/otaria-releases (this repo is private, and the in-app updater
# cannot download assets from a private repo). Runs on a version tag (git tag v0.1.0 && git push origin v0.1.0)
# or by hand. Publishing the draft makes it the update offered by the app (latest.json).
# Secrets: RELEASES_TOKEN (fine-grained PAT, Contents read/write on otaria-releases only),
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (update signing key, `npx tauri signer generate`).
# macOS: signed and notarized (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8). Windows: not signed yet.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal build (one .dmg for Apple Silicon and Intel) on an Intel runner: the arm64 pool
          # (macos-latest) twice left the job unassigned for lack of capacity. Intel cross-compiles arm64.
          # ponytail: macos-15-intel is the last Intel image (retired in 2027); move back to macos-latest then.
          - platform: macos-15-intel
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      # WebKitGTK for the webview, libdbus for the keychain (keyring → Secret Service).
      - name: Linux system packages
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The universal macOS build compiles both targets.
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Rust tests (live ones are #[ignore]), once: the code is the same on every platform.
      - name: Tests
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The notarization key is a secret's text; the bundler wants a file.
      - name: App Store Connect key
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing (Developer ID Application) and notarization. Ignored by the Windows and Linux bundlers.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}                       # .p12, base64
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}             # "Developer ID Application: …"
          # Notarization through an App Store Connect API key (Users and Access → Integrations), no Apple ID password.
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}                               # Key ID
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        with:
          owner: Rhaima96
          repo: otaria-releases
          # The tag is created in otaria-releases, which does not have this repo's commits.
          releaseCommitish: main
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Otaria ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            macOS: signed and notarized.
            Windows: not signed yet; if SmartScreen warns, choose "More info" then "Run anyway".
          releaseDraft: true
          prerelease: false
          # Updater bundles (.app.tar.gz, .msi/.exe, .AppImage + .sig) only in CI, where the signing key exists:
          # in tauri.conf.json they would break local builds.
          args: ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
