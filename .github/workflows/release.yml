# Builds Otaria for macOS (one universal app: Apple Silicon + Intel), Windows and Linux, and attaches the installers
# to a draft GitHub release. Runs on a version tag (git tag v0.1.0 && git push origin v0.1.0) or by hand.
# Not signed yet: macOS signing and notarization plug in through the commented env block below.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal build (one .dmg for Apple Silicon and Intel) on an Intel runner: the arm64 pool
          # (macos-latest) twice left the job unassigned for lack of capacity. Intel cross-compiles arm64.
          # ponytail: macos-15-intel is the last Intel image (retired in 2027); move back to macos-latest then.
          - platform: macos-15-intel
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      # WebKitGTK for the webview, libdbus for the keychain (keyring → Secret Service).
      - name: Linux system packages
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The universal macOS build compiles both targets.
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Rust tests (live ones are #[ignore]), once: the code is the same on every platform.
      - name: Tests
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing and notarization, once the secrets exist (Settings → Secrets → Actions):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}                       # .p12, base64
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}             # "Developer ID Application: …"
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}                             # app-specific password
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Otaria ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            Unsigned build. On macOS, after moving Otaria to Applications, run once:
            `xattr -cr /Applications/Otaria.app`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
