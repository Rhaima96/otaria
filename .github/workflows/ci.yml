# Checks every push and pull request on Linux only (fast; the code is the same on every platform):
# i18n keys, TypeScript types, Rust unit tests (live tests are #[ignore]). Installers: release.yml.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push on the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # The Tauri crates link against WebKitGTK and libdbus even for `cargo test`.
      - name: Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm run check:i18n
      - run: npx vue-tsc --noEmit
      - run: cargo test --manifest-path src-tauri/Cargo.toml
