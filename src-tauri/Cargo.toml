[package]
name = "otaria"
version = "0.1.3"
description = "Otaria for MariaDB: desktop client"
authors = ["Otaria contributors"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "otaria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring", "client_ed25519", "client_parsec"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
tokio = { version = "1", features = ["net", "time", "io-util", "macros", "sync", "rt", "fs"] }
uuid = { version = "1", features = ["v4"] }
csv = "1.4.0"
rust_xlsxwriter = { version = "0.102.0", default-features = false, features = ["constant_memory"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# mysql_async 0.37.1 with two fixes, each marked "Otaria patch". Drop when upstream fixes them:
# - TLS "verify CA" skipped the host name check only when the rustls error text said "NotValidForName",
#   which rustls 0.23.46 no longer prints (src/io/tls/rustls_io.rs);
# - connection attributes were dropped over TLS: the SSL request left out CLIENT_CONNECT_ATTRS (src/opts/mod.rs).
[patch.crates-io]
mysql_async = { path = "vendor/mysql_async" }
